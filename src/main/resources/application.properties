spring.application.name=booking-service
server.port=${PORT:8080}
spring.datasource.url=${BOOKING_DATABASE_URL:jdbc:postgresql://localhost:5432/leaseflow}
spring.datasource.username=${BOOKING_DATABASE_USERNAME:leaseflow}
spring.datasource.password=${BOOKING_DATABASE_PASSWORD:localonly}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true

leaseflow.hold-duration=${LEASEFLOW_HOLD_DURATION:PT15M}
leaseflow.redis-enabled=${LEASEFLOW_REDIS_ENABLED:true}
leaseflow.redis-lock-ttl=${LEASEFLOW_REDIS_LOCK_TTL:PT5S}
# Fail closed if Redis is enabled but unavailable. Database-only mode is explicit.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
leaseflow.demo-enabled=${LEASEFLOW_DEMO_ENABLED:false}
server.servlet.session.timeout=4h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.mvc.problemdetails.enabled=true
