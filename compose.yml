services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: leaseflow
      POSTGRES_USER: leaseflow
      POSTGRES_PASSWORD: ${BOOKING_DATABASE_PASSWORD:-localonly}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leaseflow -d leaseflow']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: 'redis:7-alpine'
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
